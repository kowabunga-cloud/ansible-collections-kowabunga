name: release

# Publishes the collection released by semantic-release (which creates the
# Git tag and GitHub release), or, manually, an already released version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Released version (Git tag) to publish
        required: true
        type: string

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build Ansible collection
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Build Collection
      uses: artis3n/ansible_galaxy_collection@v3
      with:
        api_key: '${{ secrets.GALAXY_API_KEY }}'
        publish: false
    - run: mkdir dist
    - run: mv *.tar.gz dist
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: ansible-collection-kowabunga
        path: dist/

  publish-to-galaxy:
    name: Publish to Ansible Galaxy
    needs:
      - build
    runs-on: ubuntu-26.04
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
        persist-credentials: false
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: ansible-collection-kowabunga
        path: dist/
    - run: cp dist/*.tar.gz .
    - name: Publish Collection
      uses: artis3n/ansible_galaxy_collection@v3
      with:
        api_key: '${{ secrets.GALAXY_API_KEY }}'
        build: false

  github-release:
    name: Sign with Sigstore and upload to GitHub Release
    needs:
    - publish-to-galaxy
    runs-on: ubuntu-26.04

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: ansible-collection-kowabunga
        path: .
    - run: mkdir dist
    - run: mv *.tar.gz dist
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        "$TAG" dist/**
        --repo "$GITHUB_REPOSITORY"
        --clobber
